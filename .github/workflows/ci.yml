name: CI - Pruebas Automatizadas y DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Pruebas unitarias ────────────────────────
  tests:
    name: Correr pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias de pruebas
        run: pip install pytest pytest-cov httpx allure-pytest

      - name: Correr pruebas con cobertura y Allure
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-config=.coveragerc --alluredir=allure-results

      - name: Instalar Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generar reporte Allure
        run: allure generate allure-results --clean -o allure-report

      - name: Guardar reporte Allure
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage.xml

  # ── Job 2: Gitleaks - Secrets Scanning ─────────────
  gitleaks:
    name: Gitleaks - Buscar credenciales expuestas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correr Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: SonarCloud - Análisis de calidad ─────────
  sonarcloud:
    name: SonarCloud - Análisis de calidad
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Job 4: Postman - Pruebas de API ─────────────────
  postman:
    name: Postman - Pruebas de API
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Levantar servicio
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Instalar Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Correr colección
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman login --with-api-key $POSTMAN_API_KEY
          postman collection run f1ddb5c9-7bf4-46f7-bfad-70c15e55de45

  # ── Job 5: Trivy - Escaneo de imagen Docker ─────────
  trivy:
    name: Trivy - Escaneo de imagen
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t calculadora-app:test .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: calculadora-app:test
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Guardar reporte Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: calculadora-app:test
          format: sarif
          output: trivy-report.sarif
          exit-code: 0

      - name: Subir reporte Trivy
        uses: actions/upload-artifact@v4
        with:
          name: reporte-trivy
          path: trivy-report.sarif

  # ── Job 6: OWASP Dependency-Check ───────────────────
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Correr OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "calculadora-promedio"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --enableRetired
            --disableNodeJS

      - name: Subir reporte de dependencias
        uses: actions/upload-artifact@v4
        with:
          name: reporte-dependency-check
          path: reports/
