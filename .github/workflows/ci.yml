name: CI - Pruebas Automatizadas y DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Pruebas unitarias ────────────────────────
  tests:
    name: Correr pruebas unitarias
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias de pruebas
        run: pip install pytest pytest-cov httpx

      - name: Correr pruebas con cobertura
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-config=.coveragerc

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage.xml

  # ── Job 2: Gitleaks - Secrets Scanning ─────────────
  gitleaks:
    name: Gitleaks - Buscar credenciales expuestas
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correr Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: SonarCloud - Análisis de calidad ─────────
  sonarcloud:
    name: SonarCloud - Análisis de calidad
    runs-on: ubuntu-latest
    needs: tests

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
