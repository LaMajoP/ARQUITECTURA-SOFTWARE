name: CD - Despliegue a Docker Hub

on:
  workflow_run:
    workflows: ["CI - Pruebas Automatizadas y DevSecOps"]
    types:
      - completed
    branches: [ main ]

jobs:

  # ── Job 1: Construir y publicar imágenes ─────────────
  deploy:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar servicio principal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arquitectura-software:latest

      - name: Construir y publicar service_b
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.service_b
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arquitectura-software-service-b:latest

  # ── Job 2: Verificar métricas con Prometheus ─────────
  monitoring-check:
    name: Verificar métricas de Prometheus
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Levantar servicio principal
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Verificar endpoint de métricas
        run: |
          curl -f http://localhost:8000/metrics
          echo "Endpoint /metrics respondiendo correctamente"

      - name: Levantar Prometheus
        run: |
          docker run -d \
            --name prometheus \
            --network host \
            -v ${{ github.workspace }}/prometheus.yml:/etc/prometheus/prometheus.yml \
            prom/prometheus:latest
          sleep 10

      - name: Verificar que Prometheus está healthy
        run: |
          curl -f http://localhost:9090/-/healthy
          echo "Prometheus healthy"

      - name: Verificar que Prometheus recibe métricas
        run: |
          curl -s "http://localhost:9090/api/v1/query?query=up" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          results = data['data']['result']
          print(f'Targets activos: {len(results)}')
          assert len(results) > 0, 'No hay targets activos en Prometheus'
          print('Prometheus recibiendo métricas correctamente')
          "

  # ── Job 3: Resumen del despliegue ────────────────────
  notify:
    name: Resumen del despliegue
    runs-on: ubuntu-latest
    needs: monitoring-check

    steps:
      - name: Escribir resumen
        run: |
          echo "## Despliegue exitoso" >> $GITHUB_STEP_SUMMARY
          echo "| Componente | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen principal | publicada en Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen service_b | publicada en Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "| Prometheus | verificado |" >> $GITHUB_STEP_SUMMARY
          echo "| Métricas /metrics | verificado |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u) |" >> $GITHUB_STEP_SUMMARY
