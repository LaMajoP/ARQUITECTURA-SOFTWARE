name: CD - Despliegue a Docker Hub

on:
  workflow_run:
    workflows: ["CI - Pruebas Automatizadas y DevSecOps"]
    types:
      - completed
    branches: [ main ]

jobs:

  deploy:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar servicio principal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arquitectura-software:latest

      - name: Construir y publicar service_b
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.service_b
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/arquitectura-software-service-b:latest
